<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Arial, sans-serif">
<rect x="0" y="0" width="820" height="340" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#1a4971">Schema 1/2 — Alimentation 12 V bus -&gt; 5 V</text>

<!-- J1 connecteur -->
<rect x="30" y="92" width="70" height="86" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="65" y="120" font-size="13" fill="#1a4971" text-anchor="middle">J1</text>
<text x="65" y="138" font-size="11" fill="#1f2937" text-anchor="middle">12 V bus</text>
<text x="42" y="129" font-size="10" fill="#1f2937">+12</text>
<text x="42" y="166" font-size="10" fill="#1f2937">GND</text>

<!-- ligne +12 -->
<line x1="100" y1="124" x2="120" y2="124" stroke="#1f2937" stroke-width="2"/>
<!-- F1 fusible -->
<rect x="120" y="115" width="56" height="18" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="148" y="108" font-size="11" fill="#1f2937" text-anchor="middle">F1  1 A</text>
<line x1="176" y1="124" x2="200" y2="124" stroke="#1f2937" stroke-width="2"/>
<!-- D1 diode Schottky -->
<polygon points="210,114 210,134 228,124" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<line x1="228" y1="114" x2="228" y2="134" stroke="#1f2937" stroke-width="2"/>
<line x1="200" y1="124" x2="210" y2="124" stroke="#1f2937" stroke-width="2"/>
<line x1="228" y1="124" x2="290" y2="124" stroke="#1f2937" stroke-width="2"/>
<text x="219" y="108" font-size="11" fill="#1f2937" text-anchor="middle">D1 SS34</text>
<text x="250" y="118" font-size="10" fill="#b45309">+12P</text>

<!-- noeud A -->
<circle cx="270" cy="124" r="3" fill="#1f2937"/>
<!-- TVS1 -->
<line x1="270" y1="124" x2="270" y2="176" stroke="#1f2937" stroke-width="2"/>
<rect x="252" y="176" width="36" height="22" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="270" y="191" font-size="10" fill="#1f2937" text-anchor="middle">TVS</text>
<line x1="270" y1="198" x2="270" y2="270" stroke="#1f2937" stroke-width="2"/>
<text x="294" y="190" font-size="10" fill="#1f2937">TVS1 SMBJ16CA</text>

<!-- C1 -->
<circle cx="340" cy="124" r="3" fill="#1f2937"/>
<line x1="340" y1="124" x2="340" y2="150" stroke="#1f2937" stroke-width="2"/>
<line x1="326" y1="150" x2="354" y2="150" stroke="#1f2937" stroke-width="2"/>
<line x1="326" y1="159" x2="354" y2="159" stroke="#1f2937" stroke-width="2"/>
<text x="358" y="150" font-size="11" fill="#1f2937">+</text>
<line x1="340" y1="159" x2="340" y2="270" stroke="#1f2937" stroke-width="2"/>
<text x="358" y="172" font-size="10" fill="#1f2937">C1 1000 µF/25 V</text>

<!-- U1 buck -->
<line x1="290" y1="124" x2="390" y2="124" stroke="#1f2937" stroke-width="2"/>
<rect x="390" y="94" width="120" height="92" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="450" y="132" font-size="13" fill="#1a4971" text-anchor="middle">U1</text>
<text x="450" y="150" font-size="11" fill="#1f2937" text-anchor="middle">TSR 2-2450</text>
<text x="396" y="120" font-size="10" fill="#1f2937">VIN</text>
<text x="470" y="120" font-size="10" fill="#1f2937" text-anchor="end">VO</text>
<text x="450" y="180" font-size="10" fill="#1f2937" text-anchor="middle">GND</text>
<line x1="450" y1="186" x2="450" y2="270" stroke="#1f2937" stroke-width="2"/>

<!-- sortie 5V -->
<line x1="510" y1="124" x2="600" y2="124" stroke="#1f2937" stroke-width="2"/>
<!-- C2 -->
<circle cx="560" cy="124" r="3" fill="#1f2937"/>
<line x1="560" y1="124" x2="560" y2="150" stroke="#1f2937" stroke-width="2"/>
<line x1="546" y1="150" x2="574" y2="150" stroke="#1f2937" stroke-width="2"/>
<line x1="546" y1="159" x2="574" y2="159" stroke="#1f2937" stroke-width="2"/>
<line x1="560" y1="159" x2="560" y2="270" stroke="#1f2937" stroke-width="2"/>
<text x="578" y="155" font-size="10" fill="#1f2937">C2 10 µF</text>
<!-- net +5V -->
<polygon points="600,124 660,124 672,131 660,138 600,138" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="628" y="135" font-size="12" fill="#b45309" text-anchor="middle">+5V</text>

<!-- rail GND -->
<line x1="100" y1="160" x2="100" y2="270" stroke="#1f2937" stroke-width="2"/>
<line x1="100" y1="270" x2="620" y2="270" stroke="#1f2937" stroke-width="2"/>
<line x1="600" y1="290" x2="640" y2="290" stroke="#1f2937" stroke-width="2"/>
<line x1="608" y1="296" x2="632" y2="296" stroke="#1f2937" stroke-width="2"/>
<line x1="616" y1="302" x2="624" y2="302" stroke="#1f2937" stroke-width="2"/>
<line x1="620" y1="270" x2="620" y2="290" stroke="#1f2937" stroke-width="2"/>
<text x="650" y="294" font-size="12" fill="#1f2937">GND</text>

<text x="40" y="312" font-size="11" fill="#6b7280">Le +3,3 V est fourni par le regulateur interne de chaque ESP32 (alimente capteurs + cote logique MAX3232).</text>
</svg>