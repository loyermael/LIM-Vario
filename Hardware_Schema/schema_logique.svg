<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="Arial, sans-serif">
<rect x="0" y="0" width="880" height="620" fill="#ffffff"/>
<text x="20" y="26" font-size="16" fill="#1a4971">Schema 2/2 — Logique : ESP32 x2, capteurs, GPS FLARM, audio</text>
<text x="20" y="46" font-size="11" fill="#6b7280">Les etiquettes de meme nom sont reliees (labels globaux, comme dans KiCad).</text>

<!-- U2 Calculateur -->
