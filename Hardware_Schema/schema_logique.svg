<g font-size="10">
<rect x="540" y="244" width="80" height="18" rx="4" fill="#eef6ff" stroke="#2b6cb0" stroke-width="1.2"/><text x="580" y="257" fill="#1a4971" text-anchor="middle">SDA · SCL</text>
