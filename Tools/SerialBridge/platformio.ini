; ============================================================
;  L!M Vario - PONT USB<->serie (depannage)
;  Transforme l'ecran ESP32-S3 en adaptateur USB-serie pour
;  reflasher le DevKit dont la CP2102 est morte.
;
;  Cablage ecran -> DevKit :
;     GPIO43 (TX) ---> GPIO3 (RX0) du DevKit
;     GPIO44 (RX) <--- GPIO1 (TX0) du DevKit
;     GND         ---- GND
;     3V3         ---- 3V3 (alimente le DevKit)   [ou USB propre du DevKit]
;
;  Flash du DevKit ENSUITE (boot manuel) :
;   pio run -d Calculateur -t upload   (voir upload_flags --no-stub)
; ============================================================
[platformio]
build_dir = C:/PioBuild/LM-Bridge

[env:bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.flash_mode          = qio
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
